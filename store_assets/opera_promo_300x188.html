<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      height: 188px;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: radial-gradient(circle at 80% 20%, #1e293b 0%, #0a0f1d 70%, #030712 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 16px;
      position: relative;
    }
    .bg-glow {
      position: absolute;
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, rgba(248, 86, 6, 0.25) 0%, rgba(248, 86, 6, 0) 70%);
      top: -40px;
      right: -20px;
      pointer-events: none;
    }
    .badge-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: #f85606;
      box-shadow: 0 4px 12px rgba(248, 86, 6, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 10px;
    }
    .title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 11px;
      font-weight: 700;
      color: #00e676;
      letter-spacing: 0.3px;
      margin-bottom: 8px;
    }
    .tag {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 3px 10px;
      font-size: 9px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="badge-icon">৳</div>
  <div class="title">BD Price Tracker</div>
  <div class="subtitle">Daraz Price Drop Alerts 🇧🇩</div>
  <div class="tag">Automatic • 100% Free</div>
</body>
</html>
