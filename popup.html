<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD Price Tracker</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header class="app-header">
        <div class="logo-area">
            <img src="icons/icon32.png" alt="Logo" class="app-logo">
            <span class="app-title">Daraz BD Price Tracker</span>
        </div>
        <div class="header-actions">
            <button id="refreshBtn" class="icon-btn" title="Refresh all prices now">🔄</button>
            <button id="settingsBtn" class="icon-btn" title="Cloud & Telegram Settings">⚙️</button>
        </div>
    </header>

    <!-- Cloud Settings Drawer -->
    <div id="settingsDrawer" class="settings-drawer hidden">
        <h5>Cloud & Telegram 24/7 Alerts</h5>
        <p class="settings-hint">Track even when your PC is turned off.</p>
        <label class="settings-label">Cloud Backend API URL:</label>
        <input type="text" id="backendUrlInput" placeholder="https://your-api.onrender.com" class="settings-input">
        <label class="settings-label">Telegram Chat ID (Optional):</label>
        <input type="text" id="telegramChatIdInput" placeholder="e.g. 123456789" class="settings-input">
        <button id="saveSettingsBtn" class="secondary-btn">Save Settings</button>
    </div>

    <div class="action-card">
        <p id="pageStatus" class="page-status">Checking current page...</p>
        <button id="trackBtn" class="primary-btn" disabled>+ Track This Product</button>
    </div>

    <section class="watchlist-section">
        <div class="section-header">
            <h4>Your Watchlist</h4>
            <span id="itemCount" class="badge">0</span>
        </div>
        <div id="list" class="item-list"></div>
    </section>

    <div id="toast" class="toast hidden"></div>

    <script src="popup.js"></script>
</body>
</html>
